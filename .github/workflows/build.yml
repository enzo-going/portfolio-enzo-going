name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configura Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instala dependencias
        run: npm ci

      - name: Checagem de tipos e build
        run: npm run build
